<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PnP Games" />
    <title>PnP Games</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* A wooden games shelf (after the old GOG.com library the Game Director likes): boxes stand on
         planks; a game still being built wears a corner ribbon. Wood is CSS, no image. */
      :root {
        --wood-dark: #5a3519;
        --wood: #8a5a2e;
        --wood-light: #b07a45;
        --plank-top: #c4925a;
        --ink: #fff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        color: var(--ink);
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
        background:
          /* fine grain */
          repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 9px, rgba(255,255,255,.035) 9px 11px, transparent 11px 23px),
          /* broad boards */
          repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 3px, transparent 3px 200px),
          linear-gradient(180deg, var(--wood-light), var(--wood) 40%, var(--wood-dark));
        padding: max(1rem, env(safe-area-inset-top)) 1rem 2rem;
        display: flex; flex-direction: column;
      }
      header {
        max-width: 980px; margin: 0 auto 1rem; display: flex; align-items: baseline; gap: 1rem;
        padding: .6rem 1rem; border-radius: 10px;
        background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.35);
      }
      h1 { margin: 0; font-size: 1.35rem; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      header p { margin: 0; opacity: .85; font-size: .95rem; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      .shelf { max-width: 980px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
      /* One plank: the boxes stand on it. */
      .plank {
        display: flex; flex-wrap: wrap; gap: 2.2rem; justify-content: flex-start; align-items: flex-end;
        padding: 1.6rem 2rem 0; position: relative; margin-bottom: 2.2rem;
      }
      /* The empty planks share whatever height is left, so the shelf fills the screen without scrolling. */
      .plank.empty { flex: 1 1 0; min-height: 0; }
      .plank::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: -22px; height: 22px; border-radius: 3px;
        background: linear-gradient(180deg, var(--plank-top) 0 5px, var(--wood) 5px, var(--wood-dark));
        box-shadow: 0 10px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
      }
      ul { list-style: none; margin: 0; padding: 0; display: contents; }
      a.box {
        position: relative; display: block; width: 180px; height: 240px; border-radius: 3px; overflow: hidden;
        color: inherit; text-decoration: none; touch-action: manipulation;
        box-shadow: 6px 6px 10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.4);
        transition: transform .15s ease;
        z-index: 1;
      }
      a.box:hover, a.box:focus-visible { transform: translateY(-6px); outline: none; }
      a.box img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* The spine and a sheen, so it reads as a box rather than a picture. */
      a.box::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(90deg, rgba(0,0,0,.45) 0 6px, rgba(255,255,255,.18) 7px 9px, transparent 14px 60%, rgba(255,255,255,.12));
      }
      .title {
        position: absolute; left: 0; right: 0; bottom: 0; padding: .55rem .6rem .5rem 1rem;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,.78) 35%);
        font-weight: 800; letter-spacing: .03em; text-transform: uppercase; font-size: 1rem; line-height: 1.1;
        text-shadow: 0 1px 2px #000;
      }
      .title small { display: block; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: .78rem; opacity: .9; margin-top: .15rem; }
      /* In development: a corner ribbon. */
      .ribbon {
        position: absolute; top: 30px; right: -46px; width: 180px; transform: rotate(45deg);
        background: #c0392b; color: #fff; text-align: center; font-size: .62rem; font-weight: 800;
        letter-spacing: .06em; text-transform: uppercase; padding: .28rem 0; white-space: nowrap;
        box-shadow: 0 2px 4px rgba(0,0,0,.45); z-index: 2;
      }
      .blurb { display: none; }
      @media (max-width: 640px) {
        .plank { gap: 1.2rem; padding: 1.2rem 1rem 0; }
        a.box { width: 150px; height: 200px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PnP Games</h1>
      <p>Solo print-and-play games, for my own play only.</p>
    </header>
    <main class="shelf">
      <div class="plank">
        <ul>
          <li>
            <a class="box" href="./games/recycled/index.html" title="Recycled: survive 75 days on an orbital junkyard, or launch the shuttle.">
              <img src="./covers/recycled.jpg" alt="" />
              <span class="title">Recycled<small>Survive 75 days, or launch the shuttle</small></span>
            </a>
          </li>
          <li>
            <a class="box" href="./games/legend-of-hexdom/index.html" title="Legend of Hexdom: Hex Forest, maps 1-3. In development.">
              <img src="./covers/legend-of-hexdom.jpg" alt="" />
              <span class="ribbon">In development</span>
              <span class="title">Legend of Hexdom<small>Hex Forest, maps 1-3</small></span>
            </a>
          </li>
        </ul>
      </div>
      <!-- Room for the games still to come. -->
      <div class="plank empty" aria-hidden="true"></div>
      <div class="plank empty" aria-hidden="true"></div>
    </main>
  </body>
</html>
