<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PnP Games</title>
    <style>
      :root {
        --paper: #f8f6f0;
        --ink: #1f2421;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem 2rem;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.6rem;
        letter-spacing: 0.02em;
      }
      p.sub {
        margin: 0 0 2rem;
        opacity: 0.65;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      a.game {
        display: block;
        min-height: 44px;
        padding: 1rem 1.25rem;
        border: 1px solid rgba(31, 36, 33, 0.25);
        border-radius: 10px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
      }
      a.game:hover,
      a.game:focus-visible {
        border-color: var(--ink);
      }
      a.game b {
        font-size: 1.1rem;
      }
      a.game span {
        display: block;
        opacity: 0.65;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PnP Games</h1>
      <p class="sub">Solo print-and-play games, for my own play only.</p>
      <ul>
        <li>
          <a class="game" href="./games/recycled/index.html">
            <b>Recycled</b>
            <span>Survive 75 days on an orbital junkyard, or launch the shuttle.</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
